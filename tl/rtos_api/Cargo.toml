[package]
repository = "https://github.com/tosnetwork/rtos"
description = 'Minimal wrappers for TOS serialization using TL-schema'
edition = '2021'
license = 'GPL-3.0'
name = 'rtos_api'
version = '0.4.32'

[dependencies]
anyhow = '1.0'
byteorder = '1.4'
extfmt = '0.1'
hex = '0.4'
lazy_static = '1.4'
ordered-float = '2.8'
secstr = '0.4'
serde = '1.0'
serde_derive = '1.0'
thiserror = '1.0'
rtos_block = { path = '../../block' }
rtos_pq_crypto = { path = '../../pq-crypto' }

[build-dependencies]
serde_json = '1.0.52'
rtos_tl_codegen = { path = '../rtos_tl_codegen' }

[dev-dependencies]
serde_json = "1.0"
