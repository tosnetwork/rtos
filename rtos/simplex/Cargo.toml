[package]
repository = "https://github.com/tosnetwork/rtos"
name = 'simplex'
version = '1.1.0'
edition = '2021'
authors = ['RSquad']
description = 'Simplex consensus protocol implementation for TOS blockchain'
license = 'GPL-3.0'

[dependencies]
anyhow = '1.0'
base64 = '0.22'
lazy_static = '1.4'
log = '0.4'
hex = '0.4'
rand = '0.8'
crossbeam = '0.8'
metrics = '0.24'
spin = '0.7'
tokio = { features = [ 'rt-multi-thread', 'sync' ], version = '1.40' }

adnl = { features = [ 'node' ], path = '../../adnl' }
consensus-common = { path = '../consensus-common' }
rtos_block = { path = '../../block' }
rtos_pq_consensus = { path = '../../pq-consensus' }
rtos_api = { path = '../../tl/rtos_api' }
serde_json = '1.0'
serde = { version = '1.0', features = ['derive'] }

[dev-dependencies]
bincode = '1.3'
chrono = '0.4'
colored = '2.0'
env_logger = '0.11'
consensus-common = { path = '../consensus-common', features = ['test-utils'] }

[features]
default = []
integration-test-support = []
isolated-consensus-signing = ["integration-test-support"]
