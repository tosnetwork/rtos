[package]
name = "rtos_pq_consensus"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/tosnetwork/rtos"
description = "Independent consensus key custody and ML-DSA-44 signing foundation"

[dependencies]
rtos_block = { path = "../block" }
rtos_pq_crypto = { path = "../pq-crypto" }
zeroize = "1.8"
getrandom = "0.2"
libc = "0.2"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
hex = "0.4"
serde_json = "1.0"
tempfile = "3"
