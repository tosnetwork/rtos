name: Conformance

on:
  pull_request:
    branches: ["main", "release/**"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  vectors:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: rtos
    steps:
      - uses: actions/checkout@v5
        with:
          path: rtos

      - name: Read reference pin
        id: reference
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          pin = pathlib.Path("ci/conformance/REFERENCE").read_text().strip()
          if not re.fullmatch(r"[0-9a-f]{40}", pin):
              raise SystemExit("invalid conformance reference commit")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"commit={pin}\n")
          PY

      - uses: actions/checkout@v5
        with:
          repository: tosnetwork/tos
          ref: ${{ steps.reference.outputs.commit }}
          path: tos-reference
          persist-credentials: false

      - name: Install build dependencies and pinned Rust
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang cmake libssl-dev libzstd-dev libgoogle-perftools-dev build-essential
          toolchain=$(python3 -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rtos -> target
          shared-key: conformance

      - name: Run all pinned vectors and local regressions
        run: |
          python3 ci/conformance/run.py --tos ../tos-reference \
            --out "$RUNNER_TEMP/conformance" --jobs 2

      - name: Compare real RLDP2 queries with frozen native effects
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python3 ci/conformance/test_rldp2_runtime_checker.py
          task_runtime_out="$RUNNER_TEMP/conformance/rldp2-runtime"
          mkdir -p "$task_runtime_out"
          git rev-parse HEAD > "$task_runtime_out/head.txt"
          cargo run --release --package adnl --example rldp2_runtime --jobs 2 \
            < ci/conformance/rldp2_runtime_cases.tsv \
            > "$task_runtime_out/effects.jsonl" 2> "$task_runtime_out/run.log"
          sha256sum ci/conformance/rldp2_runtime_cases.tsv \
            ci/conformance/rldp2_runtime_expected.json \
            adnl/examples/rldp2_runtime.rs target/release/examples/rldp2_runtime \
            > "$task_runtime_out/sha256.txt"
          python3 ci/conformance/check_rldp2_runtime.py \
            --cases ci/conformance/rldp2_runtime_cases.tsv \
            --frozen-reference ci/conformance/rldp2_runtime_expected.json \
            --actual "$task_runtime_out/effects.jsonl" \
            > "$task_runtime_out/comparison.json"
          target/release/examples/rldp2_runtime \
            < ci/conformance/rldp2_runtime_boundaries.tsv \
            > "$task_runtime_out/boundaries.jsonl" 2> "$task_runtime_out/boundaries.log"
          sha256sum ci/conformance/rldp2_runtime_boundaries.tsv \
            ci/conformance/rldp2_runtime_boundaries_expected.json \
            >> "$task_runtime_out/sha256.txt"
          python3 ci/conformance/check_rldp2_runtime.py \
            --cases ci/conformance/rldp2_runtime_boundaries.tsv \
            --frozen-reference ci/conformance/rldp2_runtime_boundaries_expected.json \
            --actual "$task_runtime_out/boundaries.jsonl" \
            > "$task_runtime_out/boundaries-comparison.json"

      - name: Retain conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-${{ github.sha }}
          path: ${{ runner.temp }}/conformance
          if-no-files-found: warn
