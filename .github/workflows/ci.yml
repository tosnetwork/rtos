name: CI

on:
  pull_request:
    branches: ["main", "release/**"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  WORKING_DIR: .

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang libssl-dev libzstd-dev libgoogle-perftools-dev build-essential jq

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      - name: Run cargo-audit
        run: |
          set -euo pipefail

          set +e
          cargo audit --json > cargo-audit.json
          AUDIT_EXIT=$?
          set -e

          TOTAL_COUNT=$(jq '[.vulnerabilities.list[]?] | length' cargo-audit.json)
          CRITICAL_COUNT=$(jq '[.vulnerabilities.list[]? | select((((.advisory.cvss // 0) | tonumber?) // 0) >= 9)] | length' cargo-audit.json)

          echo "cargo-audit report: ${TOTAL_COUNT} total vulnerabilities, ${CRITICAL_COUNT} critical."

          if [ "${TOTAL_COUNT}" -gt 0 ]; then
            echo "Detected advisories:"
            jq -r '.vulnerabilities.list[]? | "- \(.advisory.id): \(.advisory.title) [\(.package.name) \(.package.version)] CVSS=\(.advisory.cvss // "n/a")"' cargo-audit.json
          else
            echo "No RustSec advisories found."
          fi

          if [ "${CRITICAL_COUNT}" -gt 0 ]; then
            echo "Critical RustSec advisories detected. Failing CI."
            exit 1
          fi

          if [ "${AUDIT_EXIT}" -ne 0 ] && [ "${TOTAL_COUNT}" -eq 0 ]; then
            echo "cargo-audit failed for a non-advisory reason (exit ${AUDIT_EXIT})."
            exit "${AUDIT_EXIT}"
          fi

          echo "No critical RustSec advisories found."

  fmt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          components: rustfmt

      - name: Check formatting
        run: make fmt check=--check

  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang libssl-dev libzstd-dev libgoogle-perftools-dev build-essential

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: check

      - name: Clippy
        run: make clippy

      - name: Check
        run: cargo check --all --tests --release

  tests:
    runs-on: ubuntu-latest
    # Upstream uses the ton-large runner group for this workload. Budget the
    # standard hosted runner without removing any tests from make test.
    env:
      CARGO_BUILD_JOBS: "2"
      RUST_TEST_THREADS: "1"
      TOKIO_WORKER_THREADS: "4"
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang libssl-dev libzstd-dev libgoogle-perftools-dev build-essential time

      - name: Reclaim unused runner SDK space
        run: |
          df -h .
          for task_ci_sdk in /usr/local/lib/android /usr/share/dotnet; do
            if [ -d "$task_ci_sdk" ]; then
              sudo du -sh -- "$task_ci_sdk"
              sudo rm -rf -- "$task_ci_sdk"
            fi
          done
          df -h .

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: tests

      - name: Reserve swap for memory-intensive tests
        run: |
          set -euo pipefail
          # The full-size message pool test alone needs about 21 GiB RSS.
          # Keep 20 GiB of disk headroom after allocating 32 GiB of swap.
          task_swap_file=/rtos-ci.swap
          test ! -e "$task_swap_file"
          task_free_kib=$(df -Pk / | awk 'NR == 2 {print $4}')
          if (( task_free_kib < 52 * 1024 * 1024 )); then
            echo "Insufficient disk space for test swap and build headroom" >&2
            exit 1
          fi
          sudo install -m 600 /dev/null "$task_swap_file"
          sudo fallocate -l 32G "$task_swap_file"
          sudo mkswap "$task_swap_file"
          sudo swapon "$task_swap_file"
          swapon --show
          free -m
          df -h /

      - name: Build workspace binary tests
        run: bash ci/run_with_resources.sh build-bins cargo test --release --bins --features ci_run --no-run

      - name: Run cargo tests
        run: bash ci/run_with_resources.sh full-tests env NODE_SKIP_TEST_LOGS=yes make test

      - name: Retain test resource evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-tests-resources-${{ github.sha }}
          path: ${{ runner.temp }}/rtos-ci-resources
          if-no-files-found: warn

  tests-net:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang libssl-dev libzstd-dev libgoogle-perftools-dev build-essential xxd

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: tests-net

      - name: Run network test
        run: cd rtos/tests/test_run_net && bash ./test_run_net_ci.sh
